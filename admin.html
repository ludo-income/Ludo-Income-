<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ludo Baji Admin Panel</title>
<style>
:root{--bg:#061327;--top:#081a30;--side:#071a34;--panel:#0b203c;--panel2:#0d2747;--line:#1b3b5d;--text:#f5f8ff;--muted:#9db1c9;--blue:#1769e8;--green:#10c878;--danger:#ef4d64;--purple:#713cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#14366a 0,#07162c 40%,#041022 100%)}.login-card{width:min(430px,94vw);background:#fff;color:#17202b;border-radius:22px;padding:30px;box-shadow:0 25px 80px #0008}.login-card h1{margin:0 0 22px}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #294968;border-radius:9px;background:#071a30;color:#fff;outline:none}.login-card input{background:#fff;color:#111;border-color:#d7dfe8}.btn{border:0;border-radius:9px;padding:11px 15px;color:#fff;font-weight:800}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--danger)}.gray{background:#263c57}.app{min-height:100vh;background:var(--bg)}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--top);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:10px}.brand strong{font-size:22px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1c3a60}.shell{display:flex;min-height:calc(100vh - 76px)}.sidebar{width:245px;flex:0 0 245px;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.nav-title{font-size:11px;color:#6f8aa7;text-transform:uppercase;letter-spacing:1.5px;padding:10px 12px}.nav button{width:100%;border:0;background:transparent;color:#dfeaff;text-align:left;padding:12px;border-radius:9px;display:flex;align-items:center;gap:12px;margin:3px 0;font-weight:700}.nav button:hover,.nav button.active{background:#1265dc;color:#fff}.nav .ico{width:28px;text-align:center;font-size:20px}.side-status{margin:20px 7px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0a203a}.online{color:#18d77e}.content{flex:1;min-width:0;padding:20px;overflow:hidden}.screen{max-width:1500px;margin:auto}.hero{background:linear-gradient(110deg,#2839dd,#8120ef);border-radius:14px;padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.hero h1{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:#e3e8ff}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}.stat{background:linear-gradient(180deg,#0d2847,#0a1e36);border:1px solid var(--line);border-radius:12px;padding:17px}.stat small{color:var(--muted)}.stat strong{font-size:25px;display:block;margin-top:8px}.panel{background:linear-gradient(180deg,#0b213d,#091c34);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:170px;padding:11px 12px;border:1px solid #244b70;background:#071a30;color:#fff;border-radius:9px}.option-list{display:flex;flex-direction:column;gap:8px}.option-row{display:grid;grid-template-columns:42px minmax(160px,1fr) 100px 85px 145px;gap:10px;align-items:center;background:#081a30;border:1px solid #173856;border-radius:10px;padding:10px}.thumb{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;background:#17395d;overflow:hidden;font-size:22px}.thumb img{width:100%;height:100%;object-fit:cover}.option-main{min-width:0}.option-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option-main small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.toggle{width:45px;height:25px;border-radius:20px;background:#536b84;border:0;padding:0;position:relative}.toggle i{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}.toggle.on{background:var(--green)}.toggle.on i{left:23px}.order{width:70px;padding:8px;border-radius:7px;border:1px solid #294b6b;background:#071a30;color:#fff}.row-actions{display:flex;gap:6px}.icon-btn{width:38px;height:38px;border:0;border-radius:8px;color:#fff;font-weight:800}.edit{background:#1769e8}.delete{background:#e94761}.empty{text-align:center;padding:30px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.modal-back.show{display:flex}.modal{width:min(760px,96vw);max-height:94vh;overflow:auto;background:#0a1e37;border:1px solid #2a4c70;border-radius:16px;padding:18px;box-shadow:0 30px 100px #000b}.modal-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#0a1e37;padding:5px 0 14px;z-index:2}.modal-head h2{margin:0}.x{background:#223b58;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.logo-box{display:flex;gap:15px;align-items:center;padding:12px;background:#07172a;border:1px solid #1c3c5c;border-radius:10px}.logo-preview{width:86px;height:86px;border-radius:12px;background:#17395d;display:grid;place-items:center;overflow:hidden;font-size:35px}.logo-preview img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:13px}.switch-line{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #173754}.preview{background:#031b10;border-radius:14px;padding:18px}.preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.preview-card{border-radius:12px;padding:14px;background:#092d21;text-align:center;border:1px solid #174f3b}.preview-card .pico{width:58px;height:58px;border-radius:12px;margin:auto auto 8px;background:#071b15;display:grid;place-items:center;font-size:28px;overflow:hidden}.preview-card img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;right:18px;bottom:18px;background:#0c2845;border:1px solid #315678;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200}.toast.show{display:block}.err{color:#f06b7b;min-height:20px;margin-top:8px}.success{color:#16d982}.file-note{font-size:12px;color:var(--muted);margin-top:5px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.option-row{grid-template-columns:42px 1fr 80px 70px 110px}.preview-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.topbar{height:64px;padding:0 10px}.shell{min-height:calc(100vh - 64px)}.sidebar{position:fixed;left:-255px;top:64px;height:calc(100vh - 64px);z-index:50;transition:.2s}.sidebar.open{left:0}.content{padding:10px}.brand strong{font-size:18px}.brand img{width:40px;height:40px}.hero{padding:16px;display:block}.hero .btn{margin-top:12px}.cards{grid-template-columns:repeat(2,1fr)}.option-row{grid-template-columns:42px 1fr auto}.option-row .order{display:none}.row-actions{grid-column:2/-1}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.preview-grid{grid-template-columns:repeat(2,1fr)}.menu-mobile{display:block!important}.top-actions .who{display:none}}
.menu-mobile{display:none;background:#e9efff;color:#12213a;border:0;border-radius:9px;width:40px;height:40px;font-size:22px;margin-right:8px}
<style>.skeleton{height:52px;border-radius:10px;background:linear-gradient(90deg,#0b213d 25%,#173451 37%,#0b213d 63%);background-size:400% 100%;animation:sk 1.2s infinite}@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}.page-title{margin:0 0 6px}.subtitle{color:var(--muted);margin-top:0}.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}.pagination button{border:1px solid #294b6b;background:#071a30;color:#fff;border-radius:8px;padding:7px 11px}.pagination button.active{background:var(--blue)}.mini img{width:42px;height:42px;object-fit:cover;border-radius:8px}</style></style>

</head><body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const root=document.getElementById('root');let token=localStorage.getItem('lb_admin_token')||'';let data={};let active=sessionStorage.getItem('lb_admin_active')||'dashboard';let editing=null;let fileData='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function login(){root.innerHTML='<div class="login"><form class="login-card" id="lf"><h1>⚙️ Admin Panel</h1><p class="muted">Ludo Baji Management</p><div class="field"><label>Username</label><input id="lu" autocomplete="username" required></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn green" style="width:100%">Login</button><div id="le" class="err"></div></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:lu.value.trim(),password:lp.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');token=j.token;localStorage.setItem('lb_admin_token',token);await load()}catch(x){le.textContent=x.message}}}
async function api(path,opt={}){const headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(path,{...opt,headers,cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('lb_admin_token');token='';login();throw Error('Session expired')}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{data=(await api('/api/admin/data')).data||{};normalizeOptions();render()}catch(e){login()}}
function normalizeOptions(){data.mainOptions=Array.isArray(data.mainOptions)?data.mainOptions:[];const wanted=[
 ['match','Ludo Matches','🎮','Ludo Matches system-এর content এখানে Auto Show হবে।'],['deposit','Deposit','💳','Deposit system-এর content এখানে Auto Show হবে।'],['statement','My Statement','🏷️','My Statement system-এর content এখানে Auto Show হবে।'],['withdraw','Withdraw','💰','Withdraw system-এর content এখানে Auto Show হবে।'],['support','Support','✅','Support system-এর content এখানে Auto Show হবে।'],['mymatch','My Match','🎮','My Match system-এর content এখানে Auto Show হবে।'],['notifications','Notifications','🔔','Notifications system-এর content এখানে Auto Show হবে।'],['referral','Referral','🔗','Referral system-এর content এখানে Auto Show হবে।'],['leaderboard','Leaderboard','🏆','Leaderboard system-এর content এখানে Auto Show হবে।']
];let changed=false;wanted.forEach((w,i)=>{if(!data.mainOptions.some(x=>x.id===w[0])){data.mainOptions.push({id:w[0],name:w[1],icon:w[2],logo:'',content:w[3],visible:true,order:i+1,short_name:'',button_text:'',action:'auto',background:'#092d21',text_color:'#ffffff',border_radius:12});changed=true}});data.mainOptions=data.mainOptions.map((x,i)=>x.id==='match'&&(!x.name||x.name==='Match')?{...x,name:'Ludo Matches',content:x.content||'Ludo Matches system-এর content এখানে Auto Show হবে।',visible:x.visible!==false,order:Number(x.order||i+1)}:{...x,visible:x.visible!==false,order:Number(x.order||i+1)}).sort((a,b)=>a.order-b.order);if(changed)saveData(false)}
async function saveData(show=true){const j=await api('/api/admin/data',{method:'PUT',body:JSON.stringify({mainOptions:data.mainOptions,site:data.site,system:data.system,paymentMethods:data.paymentMethods})});data=j.data||data;data.paymentMethods=Array.isArray(data.paymentMethods)?data.paymentMethods:[];if(show)toast('Saved — Main Page Live')}
function render(){root.innerHTML='<div class="app"><header class="topbar"><div class="brand"><button class="menu-mobile" id="mm" onclick="toggleMenu()">☰</button><img src="'+esc(data.site?.logo||'logo-ludo-baji.jpg')+'"><strong>'+esc(data.site?.name||'Ludo Baji')+'</strong></div><div class="top-actions"><span class="online who">● Online</span><span class="who">Admin</span><div class="avatar">👤</div><button class="btn red" onclick="logout()">Logout</button></div></header><div class="shell"><aside class="sidebar" id="side"><div class="nav-title">Control</div><nav class="nav"><button class="'+(active==='dashboard'?'active':'')+'" onclick="select(\'dashboard\')"><span class="ico">📊</span>Dashboard</button><button class="'+(active==='admin-account'?'active':'')+'" onclick="select(\'admin-account\')"><span class="ico">💼</span>Admin Account</button><button class="'+(active==='main'?'active':'')+'" onclick="select(\'main\')"><span class="ico">🏠</span>Main Page</button><button class="'+(active==='users'?'active':'')+'" onclick="select(\'users\')"><span class="ico">👥</span>User Management</button><button class="'+(active==='payments'?'active':'')+'" onclick="select(\'payments\')"><span class="ico">💳</span>Deposit Management</button><button class="'+(active==='withdrawals'?'active':'')+'" onclick="select(\'withdrawals\')"><span class="ico">💰</span>Withdrawal Management</button><button class="'+(active==='matches'?'active':'')+'" onclick="select(\'matches\')"><span class="ico">🎮</span>Match Management</button><button class="'+(active==='reports'?'active':'')+'" onclick="select(\'reports\')"><span class="ico">📈</span>Reports</button><button class="'+(active==='support'?'active':'')+'" onclick="select(\'support\')"><span class="ico">💬</span>Support</button><button class="'+(active==='chatbox'?'active':'')+'" onclick="select(\'chatbox\')"><span class="ico">🤖</span>Chatbox Management</button><button class="'+(active==='help-links'?'active':'')+'" onclick="select(\'help-links\')"><span class="ico">ℹ️</span>Help Information</button><button class="'+(active==='website'?'active':'')+'" onclick="select(\'website\')"><span class="ico">🌐</span>Website Tools</button><button class="'+(active==='settings'?'active':'')+'" onclick="select(\'settings\')"><span class="ico">⚙️</span>Settings</button></nav><div class="side-status"><b>System Status</b><div class="online" style="margin-top:8px">● Online</div><small class="muted">Changes are live after Save.</small></div></aside><main class="content"><div class="screen" id="screen"></div></main></div></div>';select(active)}
function toggleMenu(){document.getElementById('side')?.classList.toggle('open')}


function chatboxPage(){return '<div class="hero"><div><h1>🤖 Chatbox Management</h1><p>Main Page Live Support (GIF) + WhatsApp নম্বর এখান থেকে সেট করুন। Help Links ON/OFF ও নিচে।</p></div></div><div class="panel"><h2>💬 Live Support (Main Page)</h2><div class="field"><label>ON / OFF</label><select id="swEnabled"><option value="1">ON</option><option value="0">OFF</option></select></div><div class="field"><label>WhatsApp Number (country code সহ, যেমন 88017XXXXXXXX)</label><input id="swPhone" placeholder="88017XXXXXXXX"></div><div class="field"><label>Default Message</label><input id="swMsg" placeholder="Hello Ludo Baji Support"></div><div class="field"><label>GIF / Image path বা URL</label><input id="swImg" placeholder="support-bot.png"></div><div class="field"><label>Upload GIF / Image</label><input type="file" accept="image/*,.gif" onchange="pickSwImg(this)"></div><div id="swPreview" style="margin:10px 0"></div><button class="btn green" onclick="saveSupportWidget()">💾 Save Live Support</button></div><div class="panel"><h2>ℹ️ Help Links ON/OFF</h2><div id="hlAdminBox">Loading...</div><button class="btn green" style="margin-top:12px" onclick="saveHlAdmin()">💾 Save Help Links</button></div>'}

function adminHelpPage(){return '<div class="hero"><div><h1>ℹ️ Help Links</h1><p>Main Page নিচের Help বাটন ON/OFF ও নাম কাস্টমাইজ করুন।</p></div><button class="btn gray" onclick="select(\'website\')">‹ Back</button></div><div class="panel"><div id="hlAdminBox">Loading...</div><button class="btn green" style="margin-top:12px" onclick="saveHlAdmin()">💾 Save Help Links</button></div>'}
async function loadHlAdmin(){const b=document.getElementById('hlAdminBox');if(!b)return;try{const j=await api('/api/admin/help-links');window._hl=j.helpLinks||[];b.innerHTML=window._hl.map((x,i)=>'<div class="option-row" style="grid-template-columns:1fr 100px 80px"><div class="option-main"><b>'+esc(x.id)+'</b><input id="hla-n-'+i+'" value="'+esc(x.name||'')+'" placeholder="Display name" style="margin-top:6px"></div><select id="hla-v-'+i+'"><option value="1"'+(x.visible!==false?' selected':'')+'>ON</option><option value="0"'+(x.visible===false?' selected':'')+'>OFF</option></select><input id="hla-o-'+i+'" type="number" value="'+(x.order||i+1)+'" style="width:70px"></div>').join('')||'<div class="empty">No links</div>'}catch(e){b.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function saveHlAdmin(){const arr=(window._hl||[]).map((x,i)=>({id:x.id,name:(document.getElementById('hla-n-'+i)?.value||x.name||x.id).trim(),visible:document.getElementById('hla-v-'+i)?.value!=='0',order:Number(document.getElementById('hla-o-'+i)?.value)||(i+1)}));await api('/api/admin/help-links',{method:'PUT',body:JSON.stringify({helpLinks:arr})});toast('Help Links saved — Main Page Live');loadHlAdmin()}
function adminSupportWidgetPage(){return '<div class="hero"><div><h1>💬 Floating Support (GIF + WhatsApp)</h1><p>Main Page-এ ভাসমান সাপোর্ট — ট্যাপ করলে WhatsApp খুলবে।</p></div><button class="btn gray" onclick="select(\'website\')">‹ Back</button></div><div class="panel"><div class="field"><label>ON / OFF</label><select id="swEnabled"><option value="1">ON</option><option value="0">OFF</option></select></div><div class="field"><label>WhatsApp Number (country code সহ)</label><input id="swPhone" placeholder="88017XXXXXXXX"></div><div class="field"><label>Default Message</label><input id="swMsg" placeholder="Hello Ludo Baji Support"></div><div class="field"><label>Image / GIF path বা URL</label><input id="swImg" placeholder="support-bot.png"></div><div class="field"><label>Image Upload</label><input type="file" accept="image/*,.gif" onchange="pickSwImg(this)"></div><div id="swPreview" style="margin:10px 0"></div><button class="btn green" onclick="saveSupportWidget()">💾 Save Support Widget</button></div>'}
async function loadSupportWidgetAdmin(){try{const j=await api('/api/admin/support-widget');const w=j.supportWidget||{};const en=document.getElementById('swEnabled');if(en)en.value=w.enabled===false?'0':'1';const ph=document.getElementById('swPhone');if(ph)ph.value=w.whatsapp||'';const ms=document.getElementById('swMsg');if(ms)ms.value=w.message||'Hello Ludo Baji Support';const im=document.getElementById('swImg');if(im)im.value=w.image||'support-bot.png';const p=document.getElementById('swPreview');if(p)p.innerHTML=w.image?'<img src="'+esc(w.image)+'" style="width:90px;height:90px;object-fit:contain;border-radius:16px;background:#000">':''}catch(e){toast(e.message)}}
function pickSwImg(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Max 2MB');return}const r=new FileReader();r.onload=()=>{document.getElementById('swImg').value=r.result;document.getElementById('swPreview').innerHTML='<img src="'+r.result+'" style="width:90px;height:90px;object-fit:contain;border-radius:16px;background:#000">' };r.readAsDataURL(f)}
async function saveSupportWidget(){const payload={enabled:document.getElementById('swEnabled').value!=='0',title:'Live Support 🔴',whatsapp:document.getElementById('swPhone').value.trim(),message:document.getElementById('swMsg').value.trim(),image:document.getElementById('swImg').value.trim()||'support-bot.png'};await api('/api/admin/support-widget',{method:'PUT',body:JSON.stringify(payload)});toast('Support Widget saved — Main Page Live')}


function adminAccountPage(){return '<div class="hero"><div><h1>💼 Admin Account</h1><p>Userদের মতো Admin-এর নিজস্ব Wallet। Match JOIN হলে Entry Fee এখানে জমা হয়। Prize Approve হলে শুধু Winning টাকা Winner পায় — লাভ Auto এখানে থাকে। লাভের টাকা bKash / Nagad / Rocket দিয়ে তুলতে পারবেন।</p></div><button class="btn blue" onclick="loadAdminAccountPage()">🔄 Refresh</button></div><div id="adminAccountBox"><div class="cards"><div class="stat"><small>Loading</small><strong>...</strong></div></div></div>'}

function drawDeposits(){const box=document.getElementById('depositsList');if(!box)return;const q=(document.getElementById('depSearch')?.value||'').trim().toLowerCase();const filteredRows=adminDeposits.filter(x=>!q||[x.user_code,x.phone,x.transaction_id,x.method,x.name].some(v=>String(v||'').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(filteredRows.length/DEPOSIT_PAGE_SIZE));depositPage=Math.min(depositPage,pages);const rows=filteredRows.slice((depositPage-1)*DEPOSIT_PAGE_SIZE,depositPage*DEPOSIT_PAGE_SIZE);const pending=adminDeposits.filter(x=>x.status==='pending').length,approved=adminDeposits.filter(x=>x.status==='approved').length,rejected=adminDeposits.filter(x=>x.status==='rejected').length,total=adminDeposits.reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('depositStats').innerHTML='<div class="stat"><small>Total Requests</small><strong>'+adminDeposits.length+'</strong></div><div class="stat"><small>Pending</small><strong>'+pending+'</strong></div><div class="stat"><small>Approved</small><strong>'+approved+'</strong></div><div class="stat"><small>Total Amount</small><strong>৳'+total.toFixed(2)+'</strong></div>';if(!rows.length){box.innerHTML='<div class="empty">কোনো Deposit Request পাওয়া যায়নি।</div>';return}box.innerHTML=rows.map(x=>'<div class="option-row" style="grid-template-columns:1fr auto"><div class="option-main"><b>'+esc(x.user_code||'Unknown User')+' • ৳'+Number(x.amount||0).toFixed(2)+'</b><small>'+esc(x.method||'')+' • TxID: '+esc(x.transaction_id||'—')+' • '+esc(x.phone||'')+' • '+esc(x.created_at||'')+'</small><small>Status: <b>'+esc(x.status||'')+'</b></small></div><div class="row-actions"><button class="btn blue" onclick="openDeposit(\''+esc(x.id)+'\')">View</button>'+(x.status==='pending'?'<button class="btn green" onclick="reviewDepositAdmin(\''+esc(x.id)+'\',\'approved\')">Approve</button><button class="btn red" onclick="reviewDepositAdmin(\''+esc(x.id)+'\',\'rejected\')">Reject</button>':'')+'</div></div>').jo async function reviewDepositAdmin(id,status){const note=document.getElementById('depNote')?.value.trim()||'';if(status==='rejected'&&!note&&!confirm('কোনো note ছাড়া Deposit Reject করবেন?'))return;if(!confirm(status==='approved'?'এই Deposit Approve করবেন?':'এই Deposit Reject করবেন?'))return;try{await api('/api/admin/deposits/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,note})});closeModal('depositModal');toast(status==='approved'?'Deposit Approved':'Deposit Rejected');await loadDeposits()}catch(e){toast(e.message)}}

function drawPayments(){const box=document.getElementById('paymentsList');if(!box)return;const q=(document.getElementById('paySearch')?.value||'').toLowerCase(),f=document.getElementById('payFilter')?.value||'all';const rows=(data.paymentMethods||[]).filter(x=>(!q||String(x.name||'').toLowerCase().includes(q)||String(x.number||'').includes(q))&&(f==='all'||(f==='on'?x.enabled!==false:x.enabled===false)));if(!rows.length){box.innerHTML='<div class="empty">কোনো Deposit Method নেই।</div>';return}box.innerHTML=rows.map(x=>'<div class="option-row"><div class="thumb">'+(x.logo?'<img src="'+esc(x.logo)+'">':esc(/nagad/i.test(String(x.provider||''))?'N':'bK'))+'</div><div class="option-main"><b>'+esc(x.name||'Deposit')+'</b><small>'+esc(x.provider||'Payment')+' • '+esc(x.account_type||'Personal')+' • '+esc(x.number||'Number not set')+'</small></div><button class="toggle '+(x.enabled!==false?'on':'')+'" title="ON / OFF" onclick="togglePayment(\''+esc(x.id)+'\')"><i></i></button><input class="order" type="number" min="1" value="'+Number(x.order||1)+'" onchange="setPaymentOrder(\''+esc(x.id)+'\',this.value)"><div class="row-actions"><button class="icon-btn edit" onclick="editPayment(\''+esc(x.id)+'\')">✎</button><button class="icon-btn delete" onclick="deletePayment(\''+esc(x.id)+'\')">🗑</button></div></div>').join('')}
function paymentModal(x,isNew=false){return '<div class="modal-back" id="paymentModal"><div class="modal"><div class="modal-head"><h2>💳 '+(isNew?'Add':'Edit')+' Deposit Method</h2><button class="x" onclick="closeModal(\'paymentModal\')">×</button></div><div class="logo-box"><div class="logo-preview" id="payLogoPreview">'+(x.logo?'<img src="'+esc(x.logo)+'">':esc(/nagad/i.test(String(x.provider||''))?'N':'bK'))+'</div><div><b>Logo / Image</b><div><input id="payLogoFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="pickPaymentLogo(this)"></div><div class="file-note">PNG/JPG/WebP • Main Page-এ Logo হিসেবে দেখাবে</div></div></div><div class="form-grid"><div class="field"><label>Payment Brand</label><input id="pProvider" list="paymentBrands" value="'+esc(x.provider||'')+'" placeholder="bKash / Nagad / Bank / Visa..."><datalist id="paymentBrands"><option value="bKash"><option value="Nagad"><option value="Bank"><option value="Visa"><option value="Mastercard"></datalist></div><div class="field"><label>Account Type</label><select id="pAccountType"><option value="Personal" '+(x.account_type==='Personal'?'selected':'')+'>Personal</option><option value="Agent" '+(x.account_type==='Agent'?'selected':'')+'>Agent</option><option value="Merchant" '+(x.account_type==='Merchant'?'selected':'')+'>Merchant</option><option value="Debit" '+(x.account_type==='Debit'?'selected':'')+'>Debit</option><option value="Visa" '+(x.account_type==='Visa'?'selected':'')+'>Visa</option></select></div><div class="field"><label>Method Name</label><input id="pName" value="'+esc(x.name||'')+'" placeholder="যেমন bKash Personal"></div><div class="field wide"><label>Number / Account Number</label><input id="pNumber" inputmode="numeric" value="'+esc(x.number||'')+'" placeholder="01XXXXXXXXX"></div><div class="field"><label>Account Name</label><input id="pAccount" value="'+esc(x.account_name||'')+'"></div><div class="field"><label>Display Order</label><input id="pOrder" type="number" min="1" value="'+Number(x.order||1)+'"></div><div class="field"><label>Minimum Deposit</label><input id="pMin" type="number" min="0" value="'+Number(x.min_deposit||0)+'"></div><div class="field"><label>Maximum Deposit</label><input id="pMax" type="number" min="0" value="'+Number(x.max_deposit||1000000)+'"></div><div class="field wide"><label>Instructions</label><textarea id="pInstructions" rows="3">'+esc(x.instructions||'')+'</textarea></div><div class="field wide"><div class="switch-line"><div><b>Show on Main Page</b><br><small class="muted">ON = Main Page-এ দেখাবে • OFF = Hide</small></div><button id="pEnabled" class="toggle '+(x.enabled!==false?'on':'')+'" onclick="document.getElementById(\'pEnabled\').classList.toggle(\'on\')"><i></i></button></div></div></div><div class="modal-head" style="position:static;border-top:1px solid #173754;margin-top:10px"><span class="muted">Save করলে Main Page-এ Live হবে</span><div><button class="btn gray" onclick="closeModal(\'paymentModal\')">Cancel</button> <button class="btn green" onclick="savePayment(\''+esc(x.id||'')+'\')">💾 Save</button></div></div></div></div>'}
let paymentLogoData='';
function pickPaymentLogo(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{paymentLogoData=r.result;document.getElementById('payLogoPreview').innerHTML='<img src="'+esc(paymentLogoData)+'">'};r.readAsDataURL(f)}
function addPaymentMethod(){const x={id:'PAY-'+Date.now().toString(36),provider:'bKash',account_type:'Personal',name:'New Deposit Method',number:'',account_name:'',logo:'',enabled:true,order:(data.paymentMethods||[]).length+1,min_deposit:50,max_deposit:1000000,instructions:''};paymentLogoData='';document.body.insertAdjacentHTML('beforeend',paymentModal(x,true));document.getElementById('paymentModal').classList.add('show')}
function editPayment(id){const x=(data.paymentMethods||[]).find(a=>a.id===id);if(!x)return;paymentLogoData=x.logo||'';document.body.insertAdjacentHTML('beforeend',paymentModal(x));document.getElementById('paymentModal').classList.add('show')}
async function savePayment(id){const name=document.getElementById('pName').value.trim(),number=document.getElementById('pNumber').value.trim();if(!name||!number){toast('Method Name ও Number দিন');return}const payload={id,provider:document.getElementById('pProvider').value.trim()||'Payment',account_type:document.getElementById('pAccountType').value,name,number,account_name:document.getElementById('pAccount').value.trim(),order:Math.max(1,Number(document.getElementById('pOrder').value)||1),min_deposit:Math.max(0,Number(document.getElementById('pMin').value)||0),max_deposit:Math.max(0,Number(document.getElementById('pMax').value)||1000000),instructions:document.getElementById('pInstructions').value,enabled:document.getElementById('pEnabled').classList.contains('on'),logo:paymentLogoData};let x=(data.paymentMethods||[]).find(a=>a.id===id);if(x){Object.assign(x,payload);await saveData(false)}else{const j=await api('/api/admin/payment-methods',{method:'POST',body:JSON.stringify(payload)});data.paymentMethods=Array.isArray(data.paymentMethods)?data.paymentMethods:[];data.paymentMethods.push(j.method)}closeModal('paymentModal');select('payments');toast('Deposit Method Saved — Main Page Live')}
function togglePayment(id){const x=(data.paymentMethods||[]).find(a=>a.id===id);if(!x)return;x.enabled=x.enabled===false;saveData(false).then(()=>{drawPayments();toast(x.enabled?'Deposit Method ON — Main Page Live':'Deposit Method OFF — Main Page Hide')})}
function setPaymentOrder(id,v){const x=(data.paymentMethods||[]).find(a=>a.id===id);if(x)x.order=Math.max(1,Number(v)||1)}
async function deletePayment(id){const x=(data.paymentMethods||[]).find(a=>a.id===id);if(!x)return;if(!confirm('“'+x.name+'” Delete করবেন?'))return;await api('/api/admin/payment-methods/'+encodeURIComponent(id),{method:'DELETE'});data.paymentMethods=data.paymentMethods.filter(a=>a.id!==id);drawPayments();toast('Deposit Method Deleted')}
let userList=[],userPage=1;const USER_PAGE_SIZE=20;
function usersPage(){return '<div class="hero"><div><h1>👥 User Management</h1><p>Users, status, balances, history ও support এক জায়গা থেকে manage করুন।</p></div></div><div class="panel"><div class="toolbar"><input id="userSearch" placeholder="User Code / Name / Phone / Email search..." onkeydown="if(event.key===\'Enter\')loadUsers()"><select id="userStatus" onchange="loadUsers()"><option value="all">All Users</option><option value="active">Active Users</option><option value="blocked">Blocked Users</option></select><button class="btn blue" onclick="loadUsers()">🔎 Search</button></div><div id="usersTable"></div></div>'}
function userRow(x){const blocked=x.status==='blocked';const btnBg=blocked?'#ef4d64':'#10c878';const btnTxt=blocked?'Unblock':'Block';const next=blocked?'active':'blocked';return '<div class="option-row" style="grid-template-columns:42px minmax(120px,1fr) auto auto"><div class="thumb">👤</div><div class="option-main"><b>'+esc(x.user_code||'')+' — '+esc(x.name||'No Name')+'</b><small>'+esc(x.phone||x.email||'No contact')+' • ৳'+Number(x.gaming_balance||0).toFixed(0)+' / ৳'+Number(x.winning_balance||0).toFixed(0)+'</small></div><span class="muted">'+esc(x.status||'active')+'</span><button type="button" class="btn" style="min-width:90px;background:'+btnBg+';border:0;color:#fff;font-weight:800" onclick="toggleUserStatus(\''+esc(x.id)+'\',\''+next+'\')">'+btnTxt+'</button><div class="row-actions"><button class="icon-btn edit" onclick="openUser(\''+esc(x.id)+'\')">View</button></div></div>'}

function drawUsersPage(){const box=document.getElementById('usersTable');if(!box)return;const pages=Math.max(1,Math.ceil(userList.length/USER_PAGE_SIZE));userPage=Math.min(userPage,pages);const rows=userList.slice((userPage-1)*USER_PAGE_SIZE,userPage*USER_PAGE_SIZE);box.innerHTML=rows.length?'<div class="option-list">'+rows.map(userRow).join('')+'</div>'+pageControls(userPage,pages,'goUserPage'):'<div class="empty">No users found</div>'}
function goUserPage(n){userPage=n;drawUsersPage()}
function pageControls(page,pages,fn){if(pages<=1)return '';let h='<div class="pagination">';for(let i=1;i<=pages;i++){if(i<=3||i>pages-3||Math.abs(i-page)<=1)h+='<button class="'+(i===page?'active':'')+'" onclick="'+fn+'('+i+')">'+i+'</button>';else if(i===4||i===pages-3)h+='<span>…</span>'}return h+'</div>'}
async function toggleUserStatus(id,status){if(!confirm(status==='blocked'?'এই User Block করবেন?':'এই User Unblock করবেন?'))return;try{await api('/api/admin/users/'+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status})});toast(status==='blocked'?'User Blocked':'User Unblocked');loadUsers()}catch(e){toast(e.message)}}
function userDetailModal(d){const u=d.user||{},b=d.dashboard||{};return '<div class="modal-back show" id="userModal"><div class="modal"><div class="modal-head"><h2>👤 '+esc(u.user_code||'User')+'</h2><button class="x" onclick="closeModal(\'userModal\')">×</button></div><div class="cards"><div class="stat"><small>Status</small><strong>'+esc(u.status||'')+'</strong></div><div class="stat"><small>Gaming Balance</small><strong>৳'+Number(b.gaming_balance||0).toFixed(2)+'</strong></div><div class="stat"><small>Winning Balance</small><strong>৳'+Number(b.winning_balance||0).toFixed(2)+'</strong></div><div class="stat"><small>Joined Matches</small><strong>'+Number(b.joined_matches||0)+'</strong></div></div><div class="panel"><h3>Profile</h3><p><b>Name:</b> '+esc(u.name||'—')+'</p><p><b>Phone:</b> '+esc(u.phone||'—')+'</p><p><b>Email:</b> '+esc(u.email||'—')+'</p><p><b>Created:</b> '+esc(u.created_at||'—')+'</p><button class="btn '+(u.status==='blocked'?'red':'green')+'" onclick="toggleFromDetail(\''+esc(u.id)+'\',\''+(u.status==='blocked'?'active':'blocked')+'\')">'+(u.status==='blocked'?'Unblock User':'Block User')+'</button></div><div class="panel"><h3>💰 Balance Adjustment</h3><div class="form-grid"><div class="field"><label>Balance</label><select id="ubType"><option value="gaming">Gaming Balance</option><option value="winning">Winning Balance</option></select></div><div class="field"><label>Amount (+ add / − subtract)</label><input id="ubAmount" type="number" step="0.01"></div><div class="field wide"><label>Note</label><input id="ubNote" placeholder="Reason"></div></div><button class="btn green" onclick="adjustUser(\''+esc(u.id)+'\')">Save Balance Change</button></div><div class="panel"><h3>📨 Send Notification</h3><div class="field"><label>Title</label><input id="unTitle" value="Admin Notification"></div><div class="field"><label>Message</label><textarea id="unMessage" rows="3"></textarea></div><button class="btn blue" onclick="notifyUser(\''+esc(u.id)+'\')">Send Notification</button></div>'+historyBlock('Transactions',d.transactions||[],tx=>esc(tx.type)+' • '+esc(tx.status)+' • ৳'+Number(tx.amount||0).toFixed(2)+' • '+esc(tx.note||''))+historyBlock('Deposit History',d.deposits||[],x=>esc(x.method)+' • ৳'+Number(x.amount||0).toFixed(2)+' • '+esc(x.status)+' • '+esc(x.transaction_id||''))+historyBlock('Withdrawal History',d.withdrawals||[],x=>esc(x.method)+' • ৳'+Number(x.amount||0).toFixed(2)+' • '+esc(x.status)+' • '+esc(x.balance_type||''))+historyBlock('Match History',d.matches||[],x=>esc(x.match_code||x.id)+' • '+esc(x.title||'')+' • '+esc(x.status||''))+historyBlock('Notifications',d.notifications||[],x=>esc(x.title)+' • '+esc(x.message))+historyBlock('Support History',d.support||[],x=>esc(x.sender)+' • '+esc(x.message))+'</div></div>'}
function historyBlock(title,arr,fn){return '<div class="panel"><h3>'+title+' <small class="muted">('+arr.length+')</small></h3>'+(arr.length?'<div class="option-list">'+arr.slice(0,100).map(x=>'<div style="padding:10px;border-bottom:1px solid #173754">'+fn(x)+'<br><small class="muted">'+esc(x.created_at||'')+'</small></div>').join('')+'</div>':'<div class="empty">No history</div>')+'</div>'}
async function openUser(id){try{const d=await api('/api/admin/users/'+encodeURIComponent(id));document.body.insertAdjacentHTML('beforeend',userDetailModal(d))}catch(e){toast(e.message)}}
async function toggleFromDetail(id,status){await toggleUserStatus(id,status);closeModal('userModal');openUser(id)}
async function adjustUser(id){const balance_type=document.getElementById('ubType').value,amount=Number(document.getElementById('ubAmount').value),note=document.getElementById('ubNote').value.trim();if(!Number.isFinite(amount)||amount===0)return toast('Amount দিন');try{await api('/api/admin/users/'+encodeURIComponent(id)+'/balance',{method:'POST',body:JSON.stringify({balance_type,amount,note})});toast('Balance updated');closeModal('userModal');loadUsers();openUser(id)}catch(e){toast(e.message)}}
async function notifyUser(id){const title=document.getElementById('unTitle').value.trim(),message=document.getElementById('unMessage').value.trim();if(!title||!message)return toast('Title ও Message দিন');try{await api('/api/admin/users/'+encodeURIComponent(id)+'/notify',{method:'POST',body:JSON.stringify({title,message})});toast('Notification sent');document.getElementById('unMessage').value=''}catch(e){toast(e.message)}}
