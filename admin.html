<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Income — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;background:#111827;color:#fff;padding:16px 20px;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input,textarea,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px}
.btn{border:0;border-radius:8px;padding:11px 14px;cursor:pointer}.primary{background:#6d28d9;color:#fff}.danger{background:#dc2626;color:#fff}
.muted{color:#64748b}.hidden{display:none}.match{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px}
@media(max-width:600px){.top{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><strong>Ludo Income Admin</strong><div style="color:#cbd5e1">Control main website</div></div><button class="btn danger" id="logout" style="display:none">Logout</button></div>

<section id="login" class="card" style="max-width:430px;margin:30px auto">
<h2>Admin Login</h2>
<div class="field"><label>Email</label><input id="email" type="email" value="admin@example.com"></div>
<div class="field"><label>Password</label><input id="password" type="password"></div>
<button class="btn primary" id="loginBtn">Login</button><p id="loginMsg" class="muted"></p>
</section>

<section id="panel" class="hidden">
<div class="grid">
<div class="card">
<h2>Website Settings</h2>
<div class="field"><label>Site Name</label><input id="siteName"></div>
<div class="field"><label>Tagline</label><input id="tagline"></div>
<div class="field"><label>Notice</label><textarea id="notice"></textarea></div>
<div class="field"><label>Support</label><input id="support"></div>
<div class="field"><label>Primary Color</label><input id="primaryColor" placeholder="#6d28d9"></div>
<div class="field"><label><input id="showNotice" type="checkbox"> Show Notice</label>
<label><input id="maintenance" type="checkbox"> Maintenance Mode</label></div>
<button class="btn primary" id="save">Save Settings</button><p id="saveMsg" class="muted"></p>
</div>

<div class="card">
<h2>Change Admin Password</h2>
<div class="field"><label>Current Password</label><input id="currentPassword" type="password"></div>
<div class="field"><label>New Password</label><input id="newPassword" type="password"></div>
<div class="field"><label>Confirm New Password</label><input id="confirmPassword" type="password"></div>
<button class="btn primary" id="changePass">Change Password</button><p id="passMsg" class="muted"></p>
</div>
</div>

<div class="card" style="margin-top:18px">
<h2>Matches</h2><div id="matchList"></div>
<h3>Add Match</h3>
<div class="grid">
<div class="field"><label>Name</label><input id="mName"></div>
<div class="field"><label>Time</label><input id="mTime"></div>
<div class="field"><label>Players</label><input id="mPlayers" value="2 Players"></div>
<div class="field"><label>Status</label><select id="mStatus"><option>Open</option><option>Running</option><option>Completed</option><option>Cancelled</option></select></div>
</div>
<button class="btn primary" id="addMatch">Add Match</button>
</div>
</section>
</div>

<script>
let token=localStorage.getItem('li_admin_token');
const $=id=>document.getElementById(id);
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showPanel(){if(!token)return;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').style.display='block';load()}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('li_admin_token',token);showPanel()}catch(e){$('loginMsg').textContent=e.message}}
async function load(){try{const s=await api('/api/admin/settings');['siteName','tagline','notice','support','primaryColor'].forEach(k=>$(k).value=s[k]||'');$('showNotice').checked=!!s.showNotice;$('maintenance').checked=!!s.maintenance;const m=await api('/api/admin/matches');$('matchList').innerHTML=m.length?m.map(x=>`<div class="match"><span><b>${esc(x.name)}</b><br><small>${esc(x.time)} · ${esc(x.players)} · ${esc(x.status)}</small></span><button class="btn danger" onclick="delMatch('${esc(x.id)}')">Delete</button></div>`).join(''):'<p class="muted">No matches</p>'}catch(e){if(e.message.includes('Session')){localStorage.removeItem('li_admin_token');location.reload()}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginBtn').onclick=login;
$('save').onclick=async()=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify({siteName:$('siteName').value,tagline:$('tagline').value,notice:$('notice').value,support:$('support').value,primaryColor:$('primaryColor').value,showNotice:$('showNotice').checked,maintenance:$('maintenance').checked})});$('saveMsg').textContent='Saved — main page updated.'}catch(e){$('saveMsg').textContent=e.message}};
$('changePass').onclick=async()=>{if($('newPassword').value!==$('confirmPassword').value){$('passMsg').textContent='Passwords do not match';return}try{await api('/api/admin/password',{method:'POST',body:JSON.stringify({currentPassword:$('currentPassword').value,newPassword:$('newPassword').value})});$('passMsg').textContent='Password changed. Login again.';localStorage.removeItem('li_admin_token');setTimeout(()=>location.reload(),700)}catch(e){$('passMsg').textContent=e.message}};
$('addMatch').onclick=async()=>{try{await api('/api/admin/matches',{method:'POST',body:JSON.stringify({name:$('mName').value,time:$('mTime').value,players:$('mPlayers').value,status:$('mStatus').value})});$('mName').value='';$('mTime').value='';load()}catch(e){alert(e.message)}};
async function delMatch(id){try{await api('/api/admin/matches/'+encodeURIComponent(id),{method:'DELETE'});load()}catch(e){alert(e.message)}}
$('logout').onclick=()=>{localStorage.removeItem('li_admin_token');location.reload()};
showPanel();
</script>
</body></html>
