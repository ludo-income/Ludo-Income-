<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Income</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{padding:18px 22px;background:#111827;color:#fff}
main{max-width:1000px;margin:auto;padding:24px}
.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:16px;border:1px solid #e5e7eb}
.notice{padding:12px;border-radius:10px;background:#ede9fe}
.match{padding:14px 0;border-top:1px solid #eee}
a{color:#6d28d9}
</style>
</head>
<body>
<header><h2 id="siteName">Ludo Income</h2><div id="tagline">Loading...</div></header>
<main>
<div id="maintenance" class="card" style="display:none"><b>Maintenance Mode</b><p>The site is temporarily unavailable.</p></div>
<div id="notice" class="card notice"></div>
<div class="card"><h3>Matches</h3><div id="matches">Loading...</div></div>
<div class="card"><b>Support:</b> <span id="support"></span></div>
</main>
<script>
async function load(){
 const r=await fetch('/api/site'); const d=await r.json(); const s=d.settings||{};
 document.title=s.siteName||'Ludo Income';
 document.getElementById('siteName').textContent=s.siteName||'Ludo Income';
 document.getElementById('tagline').textContent=s.tagline||'';
 document.getElementById('support').textContent=s.support||'';
 document.getElementById('notice').textContent=s.notice||'';
 document.getElementById('notice').style.display=s.showNotice?'block':'none';
 document.getElementById('maintenance').style.display=s.maintenance?'block':'none';
 document.documentElement.style.setProperty('--primary',s.primaryColor||'#6d28d9');
 const ms=d.matches||[];
 document.getElementById('matches').innerHTML=ms.length?ms.map(m=>`<div class="match"><b>${esc(m.name)}</b><br><small>${esc(m.time)} · ${esc(m.players)} · ${esc(m.status)}</small></div>`).join(''):'<span>No matches available.</span>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load();
</script>
</body></html>
